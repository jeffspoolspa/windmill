summary: '24h-aware retry: reuse key inside Intuit cache window, fresh key after'
description: 'Refines retry policy for charge_uncertain attempts. Within 24h:
  reuse the same row + idempotency_key (Intuit dedupes). Beyond 24h:
  auto-promote prior attempt to charge_uncertain_expired and create a fresh
  attempt with a new key. Honors charge_uncertain_expired (set by
  reconcile_payments) the same way. Adds needs_reconcile_review halt for cases
  where reconciler couldnt determine state.'
