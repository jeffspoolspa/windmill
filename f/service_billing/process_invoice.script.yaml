summary: Send paid-invoice email after every successful charge (in addition to receipt)
description: Adds send_invoice_email + Invoice webhook expectation in both the
  primary charge-success path and the orphan-recovery path. Customer now
  receives a paid copy of the invoice alongside the payment receipt — matches
  the email-only path which already sends the invoice as the deliverable.
  send_invoice_email is idempotent (skips if EmailStatus=EmailSent) so re-runs
  are safe.
