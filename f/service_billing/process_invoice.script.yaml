summary: Read preferred_payment_type + target_payment_method_id (new fields)
description: Routes on invoices.preferred_payment_type (email vs charge) instead
  of legacy payment_method (invoice vs on_file). Charges the specific PM stored
  in invoices.target_payment_method_id rather than re-picking via
  get_active_payment_method — preserves user-set per-invoice type overrides and
  matches the UI prediction. Falls back to picker only when
  target_payment_method_id is missing (legacy invoices). Writes channel +
  customer_payment_method_id on processing_attempts up-front (in create_attempt)
  so the audit trail is set before any external call.
