summary: Flip invoice to needs_review on every halt path so it surfaces in queue
description: 'Adds mark_invoice_needs_review helper + calls it from every halt
  path: charge_declined, payment_orphan, no_payment_method, email_failed
  (post-charge AND pre-flight). Without this, an invoice with a failed attempt
  stays at billing_status=ready_to_process (visible in process queue, not in
  needs-review queue) — only the WO detail page processing-card showed the
  problem. Now the invoice flips back to needs_review with a human-readable
  reason like charge_declined (HTTP 201: status=DECLINED) so it appears in the
  needs-review queue for follow-up.'
lock: '!inline f/service_billing/process_invoice.script.lock'
has_on_behalf_of: false
