summary: Fix Decimal JSON serialization crash on credit re-check halt
description: Adds _json_default + _dumps helpers (Decimal/date/datetime/UUID
  safe) and routes every json.dumps call site through them. Was crashing in
  _process_charge_path credit re-check when invoice had unmatched credits —
  load_applicable_credits returns NUMERIC unapplied_amt (Decimal) and DATE
  txn_date which json.dumps cant serialize. The new safety net caught it cleanly
  (great) but no money moved (the crash was BEFORE the charge call). Same
  pattern was latent in 9 other json.dumps call sites — all fixed.
