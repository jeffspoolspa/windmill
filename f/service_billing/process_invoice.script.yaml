summary: Respect credit_review_overridden_at in process-stage recheck
description: 'Pre-process already respects invoice.credit_review_overridden_at —
  if the office marks a credit as not applicable via the detail page Override
  button, pre_process skips the credit_review flag. Bug:
  process_invoice.load_applicable_credits IGNORED the override and halted with
  credits_available on every run, flipping the invoice back to needs_review no
  matter how many times the office overrode. Fix: if credit_review_overridden_at
  is set, skip the credit recheck. Same rule applied to dry-run plan builder.'
lock: '!inline f/service_billing/process_invoice.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 2
has_on_behalf_of: false
kind: script
schema: null
