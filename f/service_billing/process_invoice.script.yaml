summary: WAL stub on preferred_payment_type pre-flight error so batch modal sees
  the failure
description: "Pre-flight error path for invalid preferred_payment_type was
  returning silently without creating a processing_attempts row. The batch
  progress modal subscribes to processing_attempts and showed those invoices as
  'Queued' forever. Fix: write a status='error' attempt row + flip invoice to
  needs_review so the modal renders the failure visibly. Pairs with the
  billing.recheck_invoice_status fix that prevents un-pre-processed invoices
  from being promoted to ready_to_process in the first place."
lock: '!inline f/service_billing/process_invoice.script.lock'
has_on_behalf_of: false
kind: script
schema: null
