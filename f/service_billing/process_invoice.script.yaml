summary: Capture useful error messages on charge + record_payment failures
description: Adds extract_charge_error helper that pulls human-readable error
  messages from any response shape Intuit returns (standard errors array,
  top-level status, HTML 5xx, unparseable bodies). Wired into charge_card,
  charge_bank_account, and record_qbo_payment so
  processing_attempts.error_message is always populated with something useful
  instead of NULL on 5xx with non-JSON bodies. Charge_result JSON still captures
  the full response for forensics.
