summary: 'Soften charge_declined halt: only block when retrying the SAME (channel, PM)'
description: 'The charge_declined pre-flight halt was unconditional, blocking
  ANY processing after a prior decline (even if the user switched to email or
  picked a different card). Now: only halt if the new attempts (channel,
  customer_payment_method_id) matches the declined attempts. Channel change →
  proceed (email is always safe; ach != credit_card is a different network). PM
  change → proceed (different card likely works). Same-card retry still requires
  force=true.'
