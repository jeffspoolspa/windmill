summary: Track webhook_expectations after QBO PATCH for sync verification
description: Inserts a webhook_expectations row after a successful QBO Invoice
  PATCH. The webhook handler's confirm_webhook_expectation RPC marks it
  confirmed when the matching invoice.update webhook arrives; the cdc_reconciler
  flips overdue rows to 'missing'. Closes the verification loop on
  user-initiated invoice edits.
lock: '!inline f/service_billing/push_invoice_edits.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 5
has_on_behalf_of: false
kind: script
schema: null
