summary: Hold cursor on inline-refresh failure so next run retries
description: If trigger_inline_refresh returns an error, process_entity now
  returns ts_for_cursor=None — the caller skips the cursor advance for that
  entity. Otherwise a transient or schema-induced upsert failure caused the
  entity to be skipped permanently. drift_log + refresh_failures still record
  the failure for visibility.
lock: '!inline f/service_billing/cdc_reconciler.script.lock'
has_on_behalf_of: false
kind: script
schema: null
