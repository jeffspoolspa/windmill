summary: CDC-based reconciler — drift detection backstop for the webhook channel
description: Runs every 15 min via Windmill cron. Uses QBO's CDC endpoint to
  incrementally fetch entities changed since the last cursor, compares
  MetaData.LastUpdatedTime against our cache's qbo_last_updated_time, auto-heals
  soft drift via refresh_invoice/refresh_payment/qbo_customer_sync, and flags
  critical drift (cache_ahead) for human review. Also flags webhook_expectations
  past their grace window as 'missing'. This is the third leg of the Pattern D
  architecture (cache write inline + webhook fast path + reconciler truth
  backstop).
lock: '!inline f/service_billing/cdc_reconciler.script.lock'
concurrency_time_window_s: 900
concurrent_limit: 1
has_on_behalf_of: false
kind: script
schema: null
