summary: Skip column-trigger recheck during atomic pre_process writes
description: Set billing.skip_recheck=on while pre_process writes multiple
  criteria fields atomically. Without this skip, the new unified column trigger
  trg_recheck_on_invoice_change fires mid-flight and produces status flickers
  over Realtime. RESET in finally so connection reuse is clean.
lock: '!inline f/service_billing/pre_process_invoice.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 5
has_on_behalf_of: false
kind: script
schema: null
