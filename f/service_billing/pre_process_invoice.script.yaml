summary: Processed is terminal — never revert on re-run even with force
description: 'Bug: bulk pre_process (force=True) bypassed the processed-state
  guard, then write_result overwrote billing_status back to ready_to_process or
  needs_review. One invoice (ISLAND RETREAT 7798893) was reverted this way after
  it had been successfully processed. Fix: processed is terminal regardless of
  force; if you want to re-run pre-processing, Revert to Review first.'
lock: '!inline f/service_billing/pre_process_invoice.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 10
has_on_behalf_of: false
kind: script
schema: null
