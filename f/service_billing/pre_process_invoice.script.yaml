summary: Align QBO TxnDate to wo.completed in the enrichment PATCH
description: When pre_process pushes memo/class to QBO it now also PATCHes
  TxnDate to match the linked WOs completion date. Office staff often create the
  QBO invoice a day or two after the work was done so the customer-facing
  invoice date was admin-lag-dependent rather than reflecting when service
  actually happened. No-op when already aligned.
