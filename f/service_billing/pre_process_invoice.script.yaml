summary: Flip main() default bulk_all=True to False; single-WO is the safe default
description: "Bug caught in production: single-WO 'Re-run' fired every
  needs_review invoice because main() defaulted bulk_all=True and two endpoints
  (/api/billing/pre-process and /api/billing/retry) omitted the parameter.
  App-side endpoints now pass bulk_all=false explicitly; this change makes the
  script default safe so any caller that omits gets a single-WO run, not a
  mass-fire."
lock: '!inline f/service_billing/pre_process_invoice.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 5
kind: script
schema: null
