summary: Strengthen O'Brien memo prompt with explicit format/counter-examples +
  3 new few-shots
description: The LLM was producing memos like Volleyball Pool Heat Exchanger
  Diagnosis (pool name in body, no tag) instead of the required Heat Exchanger
  Diagnosis (VOLLEYBALL) format. Reformatted the rule with structured numbered
  steps, added an explicit list of CORRECT and WRONG examples (one matching the
  actual failure case), and added 3 new O'Brien few-shot examples covering the
  volleyball pool drained scenario and other variants. Existing low-confidence
  flag still triggers for missing tags as a safety net. No deterministic
  post-processor.
