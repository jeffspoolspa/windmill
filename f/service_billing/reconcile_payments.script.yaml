summary: Resolve charge_uncertain attempts via Intuit /charges search
description: For each processing_attempts.status=charge_uncertain, query Intuit
  Payments to confirm whether the charge actually landed. Match → promote to
  charge_succeeded (process_invoice picks it up). No match + >24h → promote to
  charge_uncertain_expired (safe for fresh attempt with new key). No match +
  <24h → leave alone, retry next cron tick. >7d still no match →
  needs_reconcile_review for human. Read-only against external APIs; safe to
  re-run.
lock: '!inline f/service_billing/reconcile_payments.script.lock'
