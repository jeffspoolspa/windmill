summary: Pull payments + credit memos; resolve payment method names; track was_charged
description: Pulls payments (last N days) + credit memos into
  billing.customer_payments. Resolves PaymentMethodRef.value -> name. Writes
  payment_invoice_links with applied_at = payment.txn_date so external_qbo links
  reflect when QBO recorded the payment, not when our pull ran. Refreshes
  qbo_customer_id on conflict so QBO customer merges don't strand payments under
  deleted customer ids.
