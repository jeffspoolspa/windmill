  try/except; honor QBO default flag'
description: "Three fixes for the silently-failing every-4h sweep: (1) write
  type=credit_card not card so the cpm_type_check constraint accepts the row;
  (2) read the actual default boolean from QBO instead of hardcoding False (was
  breaking PM-type resolution); (3) wrap the per-customer loop in try/except +
  rollback so one bad row doesn't skip every downstream customer (this is what
  hid RIGBY RON 1737 for days)."
