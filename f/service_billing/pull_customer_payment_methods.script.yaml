summary: Smart-selection sweep over open-invoice customers; one-customer mode
  for the new invoice-insert trigger
description: "Two invocation paths: (1) AFTER INSERT trigger on billing.invoices
  fires a webhook with only_customer_id — the real-time path keeping PMs fresh
  for every open invoice. (2) Daily backstop with no args sweeps customers with
  open invoices whose PM data is missing, stale, or pre-dates their latest
  invoice. force_refresh=true ignores TTL and sweeps all open-invoice customers
  (used to clear the cleanup backlog). Replaced the all-9k sweep with this
  targeted selection per Carter's design."
