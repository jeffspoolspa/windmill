summary: Sweep all active QBO customers; TTL via Customers.pm_last_checked_at;
  surface QBO non-2xx
description: (1) Drop the invoice_number gate so the table mirrors all QBO
  Payments customers, not just those with billable invoices — fixed COKER MIKE
  (6254) and ~8.4k other customers that were invisible. (2) Anchor TTL on
  Customers.pm_last_checked_at so customers with no PMs on file aren't
  re-fetched every cycle; CACHE_TTL_MINUTES = 1440 (24h). (3) Surface non-2xx
  QBO responses as fetch_errors that block the timestamp bump, so transient
  429/500 retries naturally instead of silently looking like "no methods on
  file" for a full TTL window. Adds only_customer_id arg for future on-demand UI
  refresh.
lock: '!inline f/service_billing/pull_customer_payment_methods.script.lock'
