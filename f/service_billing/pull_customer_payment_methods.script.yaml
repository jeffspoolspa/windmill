summary: Pull customer payment methods — safe-deactivate on fetch success only
description: 'CRITICAL fix: previous version blanket-deactivated a customer
  BEFORE fetching, then if the QBO cards/bank-accounts call errored silently
  (network / 429 / 5xx / exception), the customer was left with no active
  methods even though their real card was still in QBO. This happened to
  customer 1635 (ROWAN, JOSEPH) — their VISA x7939 got marked inactive on a
  transient failure. New behavior: retry with exponential backoff, and only
  deactivate stored methods when we get a CLEAN answer from both the cards AND
  bank-accounts endpoints. On transient failure, leave existing rows untouched
  and retry next cycle. Also adds optional customer_ids arg so process_invoice
  or admin actions can force a single-customer refresh.'
