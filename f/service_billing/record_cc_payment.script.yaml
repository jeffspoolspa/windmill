summary: record_cc_payment
description: Record an already-settled Intuit merchant card transaction as a QBO
  Payment on a given customer, carrying its CCTransId. Repairs a merchant
  payment booked to the wrong customer. Defaults to dry_run. Never sends
  ProcessPayment.
