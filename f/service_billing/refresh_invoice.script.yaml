summary: QBO invoice refresh — handles new-invoice INSERT + WO link +
  pre-processing trigger
description: 'Webhook-driven refresh script for the Invoice entity. Three paths:
  existing invoice (UPSERT volatile fields + recheck status), new invoice (full
  INSERT with all QBO fields, then link to matching WO via doc_number →
  invoice_number, which auto-fires the existing pre-processing trigger), or
  deleted invoice (404 from QBO → mark in cache). Pairs with the new
  fn_link_invoice_on_wo_change trigger that handles the inverse race (WO arrives
  after invoice).'
lock: '!inline f/service_billing/refresh_invoice.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 5
has_on_behalf_of: false
kind: script
schema: null
