summary: Classify work orders → ready_to_process (computes payment_method,
  service_category, qbo_class)
description: For each work_order in needs_classification with a cached invoice,
  computes service_category + qbo_class from type, fetches customer payment
  methods from QBO Payments API v4 (cards + ACH), determines payment_method via
  decision tree (*bill* override → invoice, has card/ACH → on_file, else →
  invoice), and transitions billing_status to ready_to_process. Caches customer
  payment methods in billing.customer_payment_methods (1hr TTL). Phase 3 of the
  service-billing refactor.
