summary: recurring_tasks (login if stale -> fetch active recurring tasks ->
  upsert in-report maintenance.tasks/task_schedules)
description: 'Ongoing ION -> maintenance task sync (analog of ion-visits /
  ion-work-orders). Step a fetches the bulk "Active Only" recurring-tasks report
  (reuses the cached session; chromium only if stale). Step b reconciles every
  IN-REPORT task into maintenance.tasks + maintenance.task_schedules keyed 1:1
  by ion_task_id: inserts new ION tasks (own row, ion_task_id + customer_id from
  ion_cust_id), refreshes financial terms/owner, and keeps them active (closure
  is by task_end + the no-visits-after-end invariant). It does NOT close on
  report-absence — a task that DROPS from the report (ION gave it an end date)
  is closed by f/ION/close_dropped_tasks, which fetches the real ION end date.
  Defaults to dry_run=true (rolls back); schedule with dry_run=false.'
value:
  modules:
    - id: a
      summary: list_recurring_tasks (session reuse -> prime -> fetch -> normalize)
      value:
        type: script
        input_transforms:
          filters:
            type: javascript
            expr: flow_input.filters ?? {}
        path: f/ION/api/list_recurring_tasks
      continue_on_error: false
      retry:
        exponential:
          attempts: 2
          multiplier: 2
          random_factor: 0
          seconds: 10
    - id: b
      summary: upsert_tasks (reconcile into maintenance.tasks/task_schedules)
      value:
        type: script
        input_transforms:
          dry_run:
            type: javascript
            expr: flow_input.dry_run ?? true
          source:
            type: static
            value: ion
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
          tasks:
            type: javascript
            expr: results.a
        path: f/ION/_lib/upsert_tasks
      continue_on_error: false
has_on_behalf_of: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - dry_run
    - filters
  properties:
    dry_run:
      type: boolean
      description: If true, perform all writes in one transaction then ROLL BACK and
        just report stats. Set false to commit.
      default: false
    filters:
      type: object
      description: Optional ION report filters (techid/OfficeID/serviceType). Empty =
        all active tasks.
      default: {}
  required: []
