summary: 'relink_visits: backfill task_id + task_schedule_id on existing
  maintenance.visits from clean tasks/schedules'
description: 'Visit re-link backfill. TEMP override: dry_run forced false for a
  one-time user-authorized commit; restored to flow_input.dry_run ?? true
  immediately after.'
value:
  modules:
    - id: a
      summary: relink visits to tasks + schedule slots
      value:
        type: script
        input_transforms:
          dry_run:
            type: static
            value: false
          overwrite:
            type: javascript
            expr: flow_input.overwrite ?? false
          since:
            type: javascript
            expr: flow_input.since || null
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
        path: f/ION/_lib/relink_visits
      continue_on_error: false
has_on_behalf_of: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - dry_run
    - overwrite
    - since
  properties:
    dry_run:
      type: boolean
      description: If true (default), do all writes in one transaction then ROLL BACK
        and report stats. Set false to commit.
      default: true
    overwrite:
      type: boolean
      description: If true, also re-resolve task_schedule_id where already set (not
        just nulls).
      default: false
    since:
      type: string
      description: Optional ISO date; only re-link visits on/after it. Empty = all visits.
      default: ''
      format: date
  required: []
