summary: 'link_visits_via_log: authoritative visit->task linker via ION service
  log (loglist->LogID->addLog->EventID)'
description: 'Authoritative log-based visit->task linker. TEMP: step c dry_run
  forced false for a one-time user-authorized commit; restored to
  flow_input.dry_run ?? true immediately after.'
value:
  modules:
    - id: a
      summary: task-less visits + ion cust hint
      value:
        type: script
        input_transforms:
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
        path: f/ION/_lib/taskless_visits
      continue_on_error: false
    - id: b
      summary: loglist -> LogID -> addLog -> EventID
      value:
        type: script
        input_transforms:
          visits:
            type: javascript
            expr: results.a.visits
        path: f/ION/api/resolve_visit_tasks_via_log
      continue_on_error: false
      timeout:
        type: static
        value: 900
    - id: c
      summary: link visit.task_id by EventID
      value:
        type: script
        input_transforms:
          dry_run:
            type: static
            value: false
          links:
            type: javascript
            expr: results.b.links
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
        path: f/ION/_lib/link_visits_by_event
      continue_on_error: false
has_on_behalf_of: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - dry_run
  properties:
    dry_run:
      type: boolean
      description: If true (default), roll back and report. Set false to commit the links.
      default: true
  required: []
