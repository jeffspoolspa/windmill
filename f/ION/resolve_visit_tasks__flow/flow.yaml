summary: 'Durable visit->task resolver: simple 1:1 by logic; complex via
  complete task-list pull + authoritative log EventID'
description: "Group May visits by customer (a). SIMPLE customers (every visit
  exactly 1 candidate) linked 1:1 by logic (b). COMPLEX customers (any 0/2+
  candidate, multi-pool) take the authoritative path: null their visits (b),
  PULL the customer's FULL ION task list and complete the task table FIRST
  (c+d), read each log's EventID (e), then OVERWRITE visit.task_id by EventID --
  ground truth (f). Pulling the full task list first guarantees every EventID
  resolves to a task we have. dry_run default FALSE (commits)."
value:
  modules:
    - id: a
      summary: classify visits simple/complex
      value:
        type: script
        input_transforms:
          billing_month:
            type: static
            value: 2026-05
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
        path: f/ION/_lib/resolve_visit_targets
    - id: b
      summary: apply simple 1:1 + null complex
      value:
        type: script
        input_transforms:
          complex_targets:
            type: javascript
            expr: results.a.complex_targets
          dry_run:
            type: javascript
            expr: flow_input.dry_run ?? false
          simple_assignments:
            type: javascript
            expr: results.a.simple_assignments
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
        path: f/ION/_lib/apply_simple_null_complex
    - id: c
      summary: pull complex customers' FULL task lists from ION
      value:
        type: script
        input_transforms:
          targets:
            type: javascript
            expr: Array.from(new
              Map(results.a.complex_targets.map(t=>[t.service_location_id,{service_location_id:t.service_location_id,name:t.name,street:t.street}])).values())
        path: f/ION/api/resolve_customer_tasks
      timeout:
        type: static
        value: 900
    - id: d
      summary: 'complete task table: upsert missing tasks'
      value:
        type: script
        input_transforms:
          dry_run:
            type: javascript
            expr: flow_input.dry_run ?? false
          rows:
            type: javascript
            expr: results.c.rows
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
        path: f/ION/_lib/upsert_nonactive_tasks
    - id: e
      summary: 'per complex visit: log -> EventID'
      value:
        type: script
        input_transforms:
          visits:
            type: javascript
            expr: results.a.complex_targets
        path: f/ION/api/resolve_visit_tasks_via_log
      timeout:
        type: static
        value: 900
    - id: f
      summary: AUTHORITATIVE link visit.task_id by EventID (overwrite)
      value:
        type: script
        input_transforms:
          dry_run:
            type: javascript
            expr: flow_input.dry_run ?? false
          links:
            type: javascript
            expr: results.e.links
          supabase_connection:
            type: static
            value: $res:u/carter/supabase
        path: f/ION/_lib/apply_event_links
has_on_behalf_of: false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - dry_run
  properties:
    dry_run:
      type: boolean
      description: false commits. Set true to roll back DB writes (ION reads still run).
      default: false
  required: []
