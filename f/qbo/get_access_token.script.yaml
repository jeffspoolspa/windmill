summary: Return a current QBO access token + realm_id (cached;
  refresh-on-expiry) for the card vault
description: Token provider for the isolated card-vault Supabase project's
  capture function. Returns {access_token, realm_id}. Caches the access token in
  script state and only performs an OAuth refresh (which rotates the shared
  u/carter/quickbooks_api refresh token) when the cached token is within 5 min
  of expiry — minimizing refresh-token rotation. Refresh+save block replicated
  verbatim from f/qbo/sync_customer_to_qbo. SET CONCURRENCY LIMIT = 1 on this
  script (Windmill UI) to serialize refreshes.
lock: '!inline f/qbo/get_access_token.script.lock'
has_on_behalf_of: false
kind: script
schema: null
