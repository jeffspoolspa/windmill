summary: QBO access token for the card vault — CACHE in front of the ADR 012 one
  door (no longer refreshes)
description: Serves a cached QBO access token to the card vault capture
  function. On a cache miss it DELEGATES the refresh to
  f/qbo/api/get_access_token (ADR 012, concurrent_limit=1), which performs the
  rotation and saves the rotated refresh token. Previously this script refreshed
  u/carter/quickbooks_api itself, making it a second independent refresher of a
  rotating token — the failure mode that burns the token and kills every QBO
  integration.
lock: '!inline f/qbo/get_access_token.script.lock'
kind: script
schema: null
