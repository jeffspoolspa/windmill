summary: check_bank_feed_cleared
description: Checks if API-created QBO deposits have been cleared in the bank
  feed using the TransactionList report. For cleared deposits, runs top-down
  validation (line-item matching) and marks as reconciled if everything matches.
  Small unlinked QBO adjustment lines (e.g. $0.03 bank encoding difference) are
  mirrored as local cash entries so the deposit can reconcile. Uses psycopg2 for
  Supabase access.
