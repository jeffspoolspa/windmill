summary: create_qbo_deposit
description: Creates QBO Deposit entities via API. Accepts a single deposit_id
  or an array of deposit_ids for batch processing. Each deposit gets its own QBO
  Deposit with payment lines, retail lines, and cash lines. Includes pre-flight
  sync check and refuses deposits where a non-retail check has no/partial linked
  payment. Uses psycopg2 for Supabase access.
